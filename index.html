<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>31 Days to Tomorrow</title>
  <style>
    :root {
      --site-primary: #f4f4f4;
      --site-on-primary: #080808;
      --site-secondary: #161616;
      --site-on-secondary: #f4f4f4;
      --site-background: #050505;
      --site-on-background: #f5f5f5;
      --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-heading-scale: 1;
      --site-spacing-scale: 1;
      --site-radius-scale: 1;
      --site-decoration-opacity: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      background: var(--site-background);
      color: var(--site-on-background);
      font-family: var(--site-font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      position: relative;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      width: 100%;
      place-items: center;
      overflow: hidden;
      padding: calc(48px * var(--site-spacing-scale)) 24px;
      background-color: light-dark(var(--site-background), var(--site-background));
      color: var(--site-on-background);
      border-radius: 0;
      isolation: isolate;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(100%, 820px);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--site-on-background);
      font-family: var(--site-font-heading);
      font-size: clamp(34px, 6.5vw, calc(66px * var(--site-heading-scale)));
      font-weight: 750;
      letter-spacing: -0.06em;
      line-height: 1.02;
      text-wrap: balance;
    }

    .countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(48px, 8vh, 82px);
    }

    .hours-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
    }

    .hours-number {
      display: block;
      font-size: clamp(124px, 25vw, 250px);
      font-weight: 740;
      letter-spacing: -0.09em;
      line-height: 0.82;
      font-variant-numeric: tabular-nums lining-nums;
      white-space: nowrap;
    }

    .hours-label {
      color: #858585;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .time-units {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 4vw, 34px);
      margin-top: clamp(34px, 5vw, 44px);
      padding: 22px 32px;
      border: 1px solid #202020;
      border-radius: 14px;
      background: #0b0b0b;
    }

    .unit {
      min-width: 62px;
    }

    .unit-value {
      display: block;
      color: #f0f0f0;
      font-size: clamp(27px, 4vw, 36px);
      font-weight: 620;
      letter-spacing: -0.05em;
      line-height: 1;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .unit-separator {
      align-self: center;
      padding-bottom: 15px;
      color: #454545;
      font-size: 28px;
      font-weight: 300;
      line-height: 1;
    }

    .unit-label {
      display: block;
      margin-top: 9px;
      color: #777777;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .quote {
      max-width: 570px;
      margin: clamp(58px, 9vh, 92px) auto 0;
      color: #8b8b8b;
      font-size: clamp(12px, 1.6vw, 14px);
      font-weight: 400;
      letter-spacing: 0.005em;
      line-height: 1.6;
    }

    .quote-mark {
      color: #c6c6c6;
    }

    .quiet-rule {
      width: 36px;
      height: 1px;
      margin: 0 auto 25px;
      background: #3a3a3a;
      opacity: var(--site-decoration-opacity);
    }

    @media (max-width: 480px) {
      .app {
        padding-right: 18px;
        padding-left: 18px;
      }

      .hours-block {
        gap: 11px;
      }

      .hours-number {
        font-size: clamp(112px, 31vw, 160px);
      }

      .time-units {
        gap: clamp(15px, 5vw, 24px);
        margin-top: 34px;
        padding: 19px 25px;
      }

      .unit {
        min-width: 48px;
      }

      .unit-separator {
        padding-bottom: 14px;
        font-size: 24px;
      }

      .quote {
        max-width: 300px;
        margin-top: 62px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .content {
        animation: arrive 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>
<body>
  <main class="app" data-sites-preview-theme="custom">
    <section class="content" aria-label="Countdown to tomorrow">
      <h1>31 days to tomorrow</h1>

      <div class="countdown" role="timer" aria-live="off" aria-label="744 total hours remaining">
        <div class="hours-block">
          <span class="hours-number" id="hours">744</span>
          <span class="hours-label">Total hours remaining</span>
        </div>

        <div class="time-units" aria-label="Minutes and seconds remaining">
          <div class="unit">
            <span class="unit-value" id="minutes">00</span>
            <span class="unit-label">Minutes</span>
          </div>
          <span class="unit-separator" aria-hidden="true">:</span>
          <div class="unit">
            <span class="unit-value" id="seconds">00</span>
            <span class="unit-label">Seconds</span>
          </div>
        </div>
      </div>

      <blockquote class="quote">
        <div class="quiet-rule" aria-hidden="true"></div>
        <span class="quote-mark">“</span>An idiot in motion goes farther than a genius at rest<span class="quote-mark">.”</span>
      </blockquote>
    </section>
  </main>

  <script>
    (() => {
      "use strict";

      const DURATION_MS = 31 * 24 * 60 * 60 * 1000;
      const COOKIE_NAME = "daysToTomorrowDeadlineV1";
      const STORAGE_NAME = "daysToTomorrowDeadlineV1";
      const COOKIE_MAX_AGE = 60 * 60 * 24 * 365;
      const SECURE_ATTRIBUTE = window.location.protocol === "https:" ? "; Secure" : "";

      const elements = {
        hours: document.getElementById("hours"),
        minutes: document.getElementById("minutes"),
        seconds: document.getElementById("seconds"),
        countdown: document.querySelector(".countdown")
      };

      const pad = value => String(value).padStart(2, "0");

      function isValidDeadline(value) {
        return Number.isSafeInteger(value) && value > 0;
      }

      function readSavedDeadline() {
        try {
          const prefix = encodeURIComponent(COOKIE_NAME) + "=";
          const savedCookie = document.cookie
            .split(";")
            .map(cookie => cookie.trim())
            .find(cookie => cookie.startsWith(prefix));

          if (savedCookie) {
            const savedValue = Number(decodeURIComponent(savedCookie.slice(prefix.length)));
            if (isValidDeadline(savedValue)) return savedValue;
          }
        } catch (error) {
          console.warn("Could not read the countdown cookie.", error);
        }

        try {
          const savedValue = Number(window.localStorage.getItem(STORAGE_NAME));
          return isValidDeadline(savedValue) ? savedValue : null;
        } catch (error) {
          console.warn("Countdown storage is unavailable.", error);
          return null;
        }
      }

      function saveDeadline(deadline) {
        const value = encodeURIComponent(String(deadline));

        try {
          // Keep the original deadline across browser sessions and restarts.
          document.cookie = encodeURIComponent(COOKIE_NAME) + "=" + value + "; Max-Age=" + COOKIE_MAX_AGE + "; Path=/; SameSite=Lax" + SECURE_ATTRIBUTE;
        } catch (error) {
          console.warn("Could not save the countdown cookie.", error);
        }

        try {
          // Local storage is a fallback when browser cookie access is restricted.
          window.localStorage.setItem(STORAGE_NAME, String(deadline));
        } catch (error) {
          console.warn("Could not save the countdown locally.", error);
        }
      }

      function getOrCreateDeadline() {
        const savedDeadline = readSavedDeadline();
        if (savedDeadline !== null) {
          saveDeadline(savedDeadline);
          return savedDeadline;
        }

        // Round up to the next second so the first displayed value is 744 hours.
        const startTime = Math.ceil(Date.now() / 1000) * 1000;
        const deadline = startTime + DURATION_MS;
        saveDeadline(deadline);
        return deadline;
      }

      const targetTime = getOrCreateDeadline();
      let timerId = null;

      function renderCountdown() {
        const remainingMs = Math.max(0, targetTime - Date.now());
        const totalSeconds = Math.floor(remainingMs / 1000);
        const totalHours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;

        elements.hours.textContent = String(totalHours);
        elements.minutes.textContent = pad(minutes);
        elements.seconds.textContent = pad(seconds);
        elements.countdown.setAttribute(
          "aria-label",
          totalHours + " total hours, " + minutes + " minutes and " + seconds + " seconds remaining"
        );

        if (remainingMs === 0) {
          timerId = null;
          return;
        }

        // Recalculate from the real deadline on every tick, avoiding drift.
        // Align updates to the next second and recover immediately after sleep.
        timerId = window.setTimeout(renderCountdown, 1000 - (Date.now() % 1000));
      }

      function refreshCountdown() {
        if (timerId !== null) window.clearTimeout(timerId);
        renderCountdown();
      }

      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshCountdown();
      });
      window.addEventListener("pageshow", refreshCountdown);
      window.addEventListener("focus", refreshCountdown);

      refreshCountdown();
    })();
  </script>
</body>
</html>
