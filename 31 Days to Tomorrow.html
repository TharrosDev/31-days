<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>31 Days to Tomorrow</title>
  <style>
    :root {
      --site-primary: #f4f4f4;
      --site-on-primary: #080808;
      --site-secondary: #161616;
      --site-on-secondary: #f4f4f4;
      --site-background: #050505;
      --site-on-background: #f5f5f5;
      --site-font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-font-heading: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --site-heading-scale: 1;
      --site-spacing-scale: 1;
      --site-radius-scale: 1;
      --site-decoration-opacity: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      background: #050505;
      color: var(--site-on-background);
      font-family: var(--site-font-body);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      position: relative;
      display: grid;
      min-height: 100svh;
      width: 100%;
      place-items: center;
      overflow: hidden;
      padding: calc(48px * var(--site-spacing-scale)) 24px;
      background-color: light-dark(var(--site-background), var(--site-background));
      color: var(--site-on-background);
      border-radius: 0;
      isolation: isolate;
    }

    .content {
      position: relative;
      z-index: 1;
      width: min(100%, 760px);
      text-align: center;
    }

    h1 {
      margin: 0;
      color: var(--site-on-background);
      font-family: var(--site-font-heading);
      font-size: clamp(34px, 6.5vw, calc(66px * var(--site-heading-scale)));
      font-weight: 750;
      letter-spacing: -0.065em;
      line-height: 1.02;
    }

    .countdown {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: clamp(38px, 7vw, 68px);
    }

    .days-block {
      display: flex;
      align-items: baseline;
      justify-content: center;
      gap: 16px;
    }

    .days-number {
      display: block;
      font-size: clamp(112px, 23vw, 218px);
      font-weight: 720;
      letter-spacing: -0.095em;
      line-height: 0.82;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .days-label {
      color: #a0a0a0;
      font-size: clamp(12px, 1.7vw, 15px);
      font-weight: 650;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .time-units {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(22px, 5vw, 48px);
      margin-top: clamp(32px, 5vw, 48px);
    }

    .unit {
      min-width: 54px;
    }

    .unit-value {
      display: block;
      color: #ededed;
      font-size: clamp(24px, 4vw, 35px);
      font-weight: 560;
      letter-spacing: -0.045em;
      line-height: 1;
      font-variant-numeric: tabular-nums lining-nums;
    }

    .unit-label {
      display: block;
      margin-top: 10px;
      color: #777777;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .quote {
      margin: clamp(54px, 8vw, 82px) 0 0;
      color: #8b8b8b;
      font-size: clamp(12px, 1.6vw, 14px);
      font-weight: 400;
      letter-spacing: 0.005em;
      line-height: 1.6;
    }

    .quote-mark {
      color: #c6c6c6;
    }

    .quiet-rule {
      width: 28px;
      height: 1px;
      margin: 0 auto 23px;
      background: #343434;
      opacity: var(--site-decoration-opacity);
    }

    @media (max-width: 480px) {
      .app {
        padding-right: 18px;
        padding-left: 18px;
      }

      .days-block {
        gap: 10px;
      }

      .time-units {
        gap: clamp(17px, 6vw, 28px);
      }

      .unit {
        min-width: 45px;
      }

      .quote {
        max-width: 300px;
        margin-right: auto;
        margin-left: auto;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .content {
        animation: arrive 900ms cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(9px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    }
  </style>
</head>
<body>
  <main class="app" data-sites-preview-theme="custom">
    <section class="content" aria-label="Countdown to tomorrow">
      <h1>31 days to tomorrow</h1>

      <div class="countdown" role="timer" aria-live="off" aria-label="Time remaining">
        <div class="days-block">
          <span class="days-number" id="days">31</span>
          <span class="days-label">Days</span>
        </div>

        <div class="time-units" aria-label="Hours, minutes and seconds remaining">
          <div class="unit">
            <span class="unit-value" id="hours">00</span>
            <span class="unit-label">Hours</span>
          </div>
          <div class="unit">
            <span class="unit-value" id="minutes">00</span>
            <span class="unit-label">Minutes</span>
          </div>
          <div class="unit">
            <span class="unit-value" id="seconds">00</span>
            <span class="unit-label">Seconds</span>
          </div>
        </div>
      </div>

      <blockquote class="quote">
        <div class="quiet-rule" aria-hidden="true"></div>
        <span class="quote-mark">“</span>An idiot in motion goes farther than a genius at rest<span class="quote-mark">.”</span>
      </blockquote>
    </section>
  </main>

  <script>
    // Fixed deadline for this 31-day countdown, in Toronto local time.
    const targetTime = new Date("2026-11-29T22:50:00-05:00").getTime();

    const elements = {
      days: document.getElementById("days"),
      hours: document.getElementById("hours"),
      minutes: document.getElementById("minutes"),
      seconds: document.getElementById("seconds")
    };

    const pad = value => String(value).padStart(2, "0");

    function updateCountdown() {
      const remaining = Math.max(0, targetTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      elements.days.textContent = String(days);
      elements.hours.textContent = pad(hours);
      elements.minutes.textContent = pad(minutes);
      elements.seconds.textContent = pad(seconds);

    }

    updateCountdown();
    window.setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
